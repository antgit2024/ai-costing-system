# COSTING-C1 · work.znma.com nginx 补丁(2026-05-04)
# 在现有 /etc/nginx/conf.d/work-https.conf 的 443 server 块里
# `location /api/planner/ { ... }` 之后、`location / { ... }` 之前 · 加入下面这块。
#
# 应用步骤:
#   sudo cp /etc/nginx/conf.d/work-https.conf /etc/nginx/conf.d/work-https.conf.bak.c1
#   sudo $EDITOR /etc/nginx/conf.d/work-https.conf       # 把下面这段贴进去
#   sudo nginx -t                                         # 校验语法
#   sudo systemctl reload nginx                           # 平滑生效
#
# 注:此 location 必须在 `location /` 之前出现 · 否则被 SPA 兜底吞掉。

    # C1 · 员工登录代理(POST /admin/auth/login + GET /admin/auth/me)
    # ai-costing 后端 /admin/auth/login 内部用 httpx 透传到 POD /api/pod/admin/staff/login
    location /admin/auth/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8800/admin/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization header 默认透传 · 双重确认
        proxy_pass_request_headers on;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
