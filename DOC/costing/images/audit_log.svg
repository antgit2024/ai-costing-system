<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#ecfeff" />
  <rect x="40" y="40" width="1120" height="120" fill="none" stroke="#0891b2" stroke-width="4" rx="12" />
  <text x="60" y="110" font-family="Inter,Arial" font-size="44" fill="#164e63">审计日志追踪（Trace Ready）</text>
  <g font-family="Inter,Arial" font-size="30" fill="#0f172a">
    <text x="110" y="220">1. 场景卡片 → 点击“审计”按钮（支持分页、搜索、Trace过滤）</text>
    <text x="110" y="280">2. Audit Drawer 调用 GET /audit?target_type=scenario&target_id=...</text>
    <text x="110" y="340">3. 每条记录展示 actor/action/timestamp/trace_id/metadata</text>
    <text x="110" y="400">4. 支持复制 trace_id、导出 JSON、跳转至导出历史</text>
    <text x="110" y="460">5. 导出/审批/克隆等操作都写入 audit_logs（含外部引用）</text>
  </g>
  <rect x="80" y="500" width="1040" height="120" fill="#cffafe" stroke="#22d3ee" stroke-width="2" rx="16" />
  <text x="110" y="560" font-family="Inter,Arial" font-size="28" fill="#0f172a">前端：AuditLogDrawer（Trace / Keyword / Pagination）</text>
  <text x="110" y="600" font-family="Inter,Arial" font-size="28" fill="#0f172a">后端：audit_service + audit_logs 表（trace_id, payload, external refs）</text>
</svg>
