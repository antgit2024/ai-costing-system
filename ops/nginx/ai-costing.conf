server {
    listen 80;
    server_name 47.99.89.206;

    root /var/www/html/ai-costing/dist;
    index index.html;

    # Let’s Encrypt HTTP-01 challenge（先保证 certbot 能通过）
   
    # 1) assets：绝对不能回退 index.html；缺文件就 404（否则会 200 + text/html 导致模块加载失败）
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2) index.html：必须 no-cache，避免客户端拿旧入口去拉新/旧 chunk
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/planner/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8800/api/planner/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }

    # 3) SPA 路由：只有非 /assets 的路由才回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
